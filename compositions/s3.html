<template>
  <style>
    @font-face { font-family: "KR"; src: local("Malgun Gothic Bold"), local("MalgunGothicBold"); font-weight: 700; }
    #root { position: absolute; inset: 0; background: #141414; overflow: hidden; }
    #s3-ghost { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font-family: "Archivo Black"; font-size: 520px; line-height: 1; color: transparent; -webkit-text-stroke: 4px #3a3a3a; letter-spacing: 0.02em; }
    .s3-row { position: absolute; left: 192px; right: 460px; display: flex; align-items: baseline; justify-content: space-between; }
    #s3-r1 { top: 210px; }
    #s3-r2 { top: 520px; }
    .s3-lab { white-space: nowrap; font-family: "KR"; font-weight: 700; font-size: 92px; color: #ffffff; letter-spacing: -0.03em; }
    .s3-num { white-space: nowrap; font-family: "Archivo Black"; font-size: 200px; line-height: 1; color: #ff3b2f; letter-spacing: -0.03em; }
    #s3-vs { position: absolute; left: 192px; top: 790px; font-family: "KR"; font-weight: 700; font-size: 56px; color: #ffc21a; }
  </style>
  <div id="root" data-composition-id="s3" data-width="1920" data-height="1080">
    <div id="s3-ghost" data-layout-ignore>COST</div>
    <div id="s3-r1" class="s3-row"><div class="s3-lab" id="s3-l1">인건비</div><div class="s3-num" id="s3-n1">+0%</div></div>
    <div id="s3-r2" class="s3-row"><div class="s3-lab" id="s3-l2">배달앱 수수료</div><div class="s3-num" id="s3-n2">+0%</div></div>
    <div id="s3-vs">매출 +24%보다 빠르게</div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const n1 = document.querySelector("#s3-n1"), n2 = document.querySelector("#s3-n2");
    const a = { v: 0 }, b = { v: 0 };
    // ghost COST is the frame-0 image; one slow push across the scene
    tl.fromTo("#s3-ghost", { scale: 1 }, { scale: 1.08, duration: 5.8, ease: "none" }, 0);
    // 인건비 slams from left on "인건비는"
    tl.fromTo("#s3-l1", { opacity: 0, x: -300 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 0.75);
    tl.fromTo("#s3-n1", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 1.0);
    tl.fromTo(a, { v: 0 }, { v: 33, duration: 1.0, ease: "power3.out", onUpdate: () => (n1.textContent = "+" + Math.round(a.v) + "%") }, 1.0);
    // 배달앱 수수료 on second phrase
    tl.fromTo("#s3-l2", { opacity: 0, x: -300 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 2.85);
    tl.fromTo("#s3-n2", { opacity: 0 }, { opacity: 1, duration: 0.1 }, 3.3);
    tl.fromTo(b, { v: 0 }, { v: 26, duration: 1.0, ease: "power3.out", onUpdate: () => (n2.textContent = "+" + Math.round(b.v) + "%") }, 3.3);
    // "뛰었습니다": both numbers jump
    tl.fromTo(["#s3-n1", "#s3-n2"], { y: 0 }, { y: -40, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out", stagger: 0.08 }, 4.5);
    tl.fromTo("#s3-vs", { opacity: 0, clipPath: "inset(0 100% 0 0)" }, { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: 0.35, ease: "power3.inOut" }, 4.25);
    window.__timelines["s3"] = tl;
  </script>
</template>
